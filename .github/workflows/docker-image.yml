name: Build and publish Docker image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/surveyking

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test-ghcr:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    env:
      MYSQL_PASSWORD: ci_surveyking_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      SURVEYKING_PORT: 1991
      SURVEYKING_IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:latest
      JAVA_OPTS: -Xms128m -Xmx512m -Duser.timezone=Asia/Shanghai
    outputs:
      passed: ${{ steps.smoke.outputs.passed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start and check SurveyKing
        id: smoke
        shell: bash
        run: |
          set -uo pipefail
          passed=false
          if timeout 150s docker compose up -d; then
            for attempt in {1..24}; do
              if curl --fail --silent --show-error http://127.0.0.1:1991/api/system | grep --quiet '"code":200'; then
                passed=true
                break
              fi
              sleep 5
            done
          fi
          docker compose ps || true
          if [ "$passed" != true ]; then
            docker compose logs || true
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes || true

  smoke-test-mirror:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    env:
      MYSQL_PASSWORD: ci_surveyking_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      SURVEYKING_PORT: 1991
      SURVEYKING_IMAGE: ghcr.nju.edu.cn/mcxiaochenn/surveyking:latest
      JAVA_OPTS: -Xms128m -Xmx512m -Duser.timezone=Asia/Shanghai
    outputs:
      passed: ${{ steps.smoke.outputs.passed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start and check SurveyKing
        id: smoke
        shell: bash
        run: |
          set -uo pipefail
          passed=false
          if timeout 150s docker compose up -d; then
            for attempt in {1..24}; do
              if curl --fail --silent --show-error http://127.0.0.1:1991/api/system | grep --quiet '"code":200'; then
                passed=true
                break
              fi
              sleep 5
            done
          fi
          docker compose ps || true
          if [ "$passed" != true ]; then
            docker compose logs || true
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes || true

  smoke-test:
    needs: [smoke-test-ghcr, smoke-test-mirror]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require one successful registry smoke test
        env:
          GHCR_PASSED: ${{ needs.smoke-test-ghcr.outputs.passed }}
          MIRROR_PASSED: ${{ needs.smoke-test-mirror.outputs.passed }}
        shell: bash
        run: |
          if [ "$GHCR_PASSED" = true ] || [ "$MIRROR_PASSED" = true ]; then
            exit 0
          fi
          echo "Both registry smoke tests failed or timed out." >&2
          exit 1
