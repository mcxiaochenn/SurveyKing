name: Build and publish Docker image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/surveyking

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    env:
      MYSQL_PASSWORD: ci_surveyking_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      SURVEYKING_PORT: 1991
      JAVA_OPTS: -Xms128m -Xmx512m -Duser.timezone=Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker Compose stack
        run: docker compose up -d

      - name: Wait for SurveyKing
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:1991/api/system | grep --quiet '"code":200'; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes
